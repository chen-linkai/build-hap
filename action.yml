name: 'Build HAP'
description: 'Build a HAP.'
author: 'clk'
branding:
  icon: 'box'
  color: 'blue'
inputs:
  workspace:
    description: 'Current working directory.'
    required: true
  version:
    description: 'The target version of the Command Line Tools.'
    required: false
    default: 'latest'
runs:
  using: 'composite'
  steps:
    - name: Prerequisites
      uses: chen-linkai/setup-hmos-pipeline@v1
      with:
        version: ${{ inputs.version }}
    - name: Configure project
      shell: bash
      env:
        DEVECO_SDK_HOME: "$COMMANDLINE_TOOL_DIR/command-line-tools/sdk"
      run: |
        cd ${{ inputs.workspace }}
        ohpm install --all --registry https://ohpm.openharmony.cn/ohpm/ --strict_ssl true
    - name: Build project
      shell: bash
      env:
        DEVECO_SDK_HOME: "$COMMANDLINE_TOOL_DIR/command-line-tools/sdk"
      run: |
        cd ${{ inputs.workspace }}
        node "$COMMANDLINE_TOOL_DIR/command-line-tools/hvigor/bin/hvigorw.js" --mode module -p product=default assembleHap --analyze=normal --parallel --incremental --no-daemon
