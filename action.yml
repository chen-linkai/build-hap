name: 'Build Hap'
description: '编译 Hap'
author: 'clk'

branding:
  icon: 'box'
  color: 'blue'

inputs:
  workspace:
    description: '工作目录'
    required: true

runs:
  using: 'composite'
  steps:
    - name: 配置工具
      shell: bash
      run: |
        gh release download --repo "CoolCLK/build-hap" --pattern 'commandline-tools-linux-x64-*.zip' --dir $RUNNER_TEMP/build-hap
        cd $RUNNER_TEMP/build-hap
        unzip -q commandline-tools-linux-x64-*.zip

    - name: 构建项目
      shell: bash
      env:
        DEVECO_SDK_HOME: ${{ runner.temp }}/build-hap/command-line-tools/sdk
      run: |
        cd ${{ inputs.workspace }}
        "$RUNNER_TEMP/build-hap/command-line-tools/ohpm/bin/ohpm" install --all --registry https://ohpm.openharmony.cn/ohpm/ --strict_ssl true
        "$RUNNER_TEMP/build-hap/command-line-tools/tool/node/bin/node" "$RUNNER_TEMP/build-hap/command-line-tools/hvigor/bin/hvigorw.js" --mode module -p product=default assembleHap --analyze=normal --parallel --incremental --daemon
